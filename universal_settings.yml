# =============================================================================
# universal_settings.yml — the project's plotting style, in one place
# =============================================================================
# Every analysis notebook builds its STYLE dict from this file instead of
# carrying its own literal:
#
#     from utils.shared_style import load_style
#     STYLE = load_style("03_academic_impact")   # base + that notebook's overrides
#
# `style.base` is what all notebooks share, and it is the ONLY place typography,
# strokes and figure sizes are set (D55): every figure is drawn 18in wide on one rung of
# a height ladder, with one set of font sizes, one colormap and black edges, so text
# prints at the same size in every figure. A `style.notebooks.<notebook stem>` section
# may set only its palette, semantic colours (`*_colors`, `roles`, `c_*`) and output
# (`save`, `formats`, `savedir`); `load_style` raises on anything else.
#
# TWO CONVENIENCES THE LOADER APPLIES
# -----------------------------------
#   roles / *_colors : an INTEGER value means "index into `colors`", so the
#                      semantic roles follow the palette when the palette changes.
#                      A string value is taken literally ("#BBBBBB").
#
# `savedir` is relative to the repo root and only used when `save: true`;
# `formats` lists the file extensions savefig writes.
# =============================================================================

style:

  # ---------------------------------------------------------------- shared base
  base:
    # Matches shared_style.PALETTE: red, cream, light blue, blue, steel blue, navy,
    # light red (a 50% white tint of the red; it replaced green in every analysis).
    colors: &project_palette ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1",
                              "#416FA0", "#274668", "#F2B4AC"]
    # The only greys (shared_style.NEUTRALS).
    neutral_colors:
      missing: "#B7B7B7"
      muted:   "#555555"
      light:   "#E5E5E5"

    # Figure size (D55): one width, height = width x one rung of the ladder.
    # Mirrors shared_style.FIG_WIDTH / FIG_ASPECTS; use shared_style.figsize(<rung>).
    fig_width: 18
    fig_aspects:
      wide:      0.5
      landscape: 0.625
      standard:  0.8
      square:    1.0
      tall:      1.25

    # Typography — Helvetica everywhere (shared_style.FONT_FAMILY). Four sizes in all,
    # in points at the 18in width (x0.4 on a 183 mm page: 8.8 / 6.4 / 5.6 / 5.2 pt).
    font_family: Helvetica
    panel_label_fs:    22
    title_fs:          22
    label_fs:          16
    colorbar_label_fs: 16
    tick_fs:           14
    legend_fs:         14
    annot_fs:          13
    small_fs:          13
    body_fs:           13

    # Strokes. Every edge on a filled mark is black at edge_linewidth; white is used only
    # as a separator between filled areas (stacked segments, map borders).
    edgecolor:       black
    separator_color: white
    edge_linewidth:  0.6
    line_width:      2.0
    ref_linewidth:   1.0
    axes_linewidth:  1.0
    tick_length:     4
    tick_width:      1.0
    tick_pad:        3
    minor_tick_length: 2.5
    minor_tick_width:  0.7

    # marker diameters are in points; scatter areas are in points squared
    marker_size:      8.5
    dot_marker_area: 76

    # Dashed gridlines are the project default, on both axes and BOTH tick levels.
    # shared_style.grid_on() is what applies them; ax.grid() by hand will get the dash
    # (this rcParam) but not the minor level, so prefer the helper.
    grid_linestyle: "--"
    grid_linewidth: 0.6
    grid_color: "#B0B0B0"
    grid_alpha: 0.6

    dpi: 500  # PNG exports are also enforced by shared_style.PNG_DPI
    save: false                                  # set true to write figures out
    formats: [pdf]
    savedir: output/figures/data_analysis

  # --------------------------------------------------- per-notebook differences
  # Palette, semantic colours and output only. Typography, strokes and sizes: see base.
  notebooks:

    00_dataset:
      colors: *project_palette
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/00_dataset

    01_growth:
      # Same stream colours as 04 (stream_colors), so an indicator keeps its colour
      # across analyses; datasets, which 04 does not plot, take the cream.
      colors: *project_palette
      metric_colors:
        publications: 3           # blue
        patents: 4                # steel blue
        clinical_trials: 5        # navy
        policy_documents: 0       # red
        datasets: 1               # cream
        cross_sector: 6           # light red (04 "company affiliations")
        altmetric: 2              # light blue
        grants: 3                 # blue
        international: 4          # steel blue
        open_access: 5            # navy
        preprints: 4              # steel blue
      c_primary_light: "#75BBD4"
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/01_growth
      roles:
        c_primary: 4        # steel blue
        c_accent:  0        # red
        c_gold:    1        # cream

    05_author_characteristics:
      # The project palette (D29), in shared_style.PALETTE_COLORS order:
      #   0 red  1 cream  2 light_blue  3 blue  4 steel_blue  5 navy  6 light_red
      colors: *project_palette
      domain_colors:
        author_metrics: 4         # steel blue
        name_gender: 0            # red
        geography: 5              # navy
        institutions: 6           # light red
        networks: 3               # blue
      author_metric_colors:
        productivity: 4           # steel blue
        h_index: 0                # red
        h_index_kde: 5            # navy
        association: 3            # blue
      gender_colors:
        Female: 0                 # red
        Male: 4                   # steel blue
        Unknown: "#B7B7B7"        # neutral "missing": not a category, an absence
      # The four network component classes, ordered cream -> light blue -> navy so the
      # size ordering is legible as a ramp, with the red reserved for the isolates that
      # sit outside that ordering.
      component_colors:
        Isolate: 0                # red
        Small (2-5): 1            # cream
        Intermediate (6-55): 2    # light blue
        Giant component: 5        # navy
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/05_author_characteristics
      roles:
        c_primary: 5              # navy
        c_accent: 0               # red
        c_gold: 1                 # cream

    02_content:
      colors: *project_palette
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/02_content

    03_academic_impact: &academic_style
      colors: *project_palette
      save: true
      # pdf + png only, per D32.
      formats: [pdf, png]
      savedir: output/figures/data_analysis/03_academic_impact

    03_academic_impact_panels:
      <<: *academic_style

    04_non_academic_panels: &non_academic_style
      <<: *academic_style
      colors: *project_palette
      savedir: output/figures/data_analysis/04_non_academic
      roles:
        c_primary:   5            # navy
        c_secondary: 4            # steel blue
        c_accent:    0            # red
        c_light:     2            # light blue
        c_red_light: 6            # light red
        c_cream:     1            # cream
      # One colour per evidence stream, held constant across every panel in the figure
      # family: a reader who learns "steel blue = patents" in panel A keeps it in panel F.
      stream_colors:
        publications:    3        # blue
        patents:         4        # steel blue
        clinical_trials: 5        # navy
        policy:          0        # red
        altmetric:       2        # light blue
        collaboration:   6        # light red
      # The collaborator taxonomy's eight sectors. Company sectors take the warm end of
      # the palette so they separate from the public-sector blues at a glance.
      sector_colors:
        "University/HEI":            3
        "Hospital/Clinical":         2
        "Government/Public":         4
        "Research institute/Centre": 6
        "Nonprofit/Charity":         1
        "Company (non-UK)":          5
        "UK company":                0
        "Other/Unknown":             "white"

    04_non_academic_01_clinical_trials:
      <<: *academic_style
      colors: *project_palette
      savedir: output/figures/data_analysis/04_non_academic/clinical_trials
      roles:
        c_accent:  0
        c_gold:    1
        c_red_light: 6
        c_primary: 4
      trial_type_colors:
        Interventional: 4
        Observational:  0

    04_non_academic_02_patents:
      <<: *non_academic_style
      savedir: output/figures/data_analysis/04_non_academic/patents

    04_non_academic_03_altmetric:
      <<: *non_academic_style

    04_non_academic_04_collaboration:
      <<: *non_academic_style
      savedir: output/figures/data_analysis/04_non_academic/collaboration
