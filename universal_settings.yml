# =============================================================================
# universal_settings.yml — the project's plotting style, in one place
# =============================================================================
# Every analysis notebook builds its STYLE dict from this file instead of
# carrying its own literal:
#
#     from utils.shared_style import load_style
#     STYLE = load_style("03_academic_impact")   # base + that notebook's overrides
#
# `style.base` is what all notebooks share. `style.notebooks.<notebook stem>`
# overrides only the keys that notebook genuinely does differently — the clinical
# trials notebook, for example, deliberately uses the LCDS palette.
#
# TWO CONVENIENCES THE LOADER APPLIES
# -----------------------------------
#   roles / *_colors : an INTEGER value means "index into `colors`", so the
#                      semantic roles follow the palette when the palette changes.
#                      A string value is taken literally ("#BBBBBB").
#   figsize*         : two-element lists become tuples, as matplotlib expects.
#
# `savedir` is relative to the repo root and only used when `save: true`;
# `formats` lists the file extensions savefig writes.
# =============================================================================

style:

  # ---------------------------------------------------------------- shared base
  base:
    # four customised colours (the project palette)
    colors: ["#B80C09", "#D4AF37", "#6E8B3D", "#345995"]

    # figure sizes
    figsize:       [12, 7]
    figsize_wide:  [14, 7]
    figsize_small: [10, 6]
    figsize_panel: [16, 12]

    # typography
    font_family: Helvetica

    # font sizes
    title_fs:  16
    label_fs:  13
    tick_fs:   11
    annot_fs:  10
    legend_fs: 11

    # marker diameters are in points; scatter areas are in points squared
    marker_size:      8.5
    dot_marker_area: 76

    # misc
    dpi: 500  # PNG exports are also enforced by shared_style.PNG_DPI
    cmap: ocean
    edgecolor: grey

    # Dashed gridlines are the project default, on both axes and BOTH tick levels.
    # shared_style.grid_on() is what applies them; ax.grid() by hand will get the dash
    # (this rcParam) but not the minor level, so prefer the helper.
    grid_linestyle: "--"
    grid_linewidth: 0.6
    grid_color: "#B0B0B0"
    grid_alpha: 0.6
    save: false                                  # set true to write figures out
    formats: [pdf]
    savedir: output/figures/data_analysis

  # --------------------------------------------------- per-notebook differences
  notebooks:

    00_dataset:
      colors: ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1", "#416FA0", "#274668", "#74D1AF"]
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/00_dataset

    01_growth:
      colors: ["#B80C09", "#D4AF37", "#6E8B3D", "#345995",
               "#8C5A9E", "#008C95", "#B56A3B", "#4F6D7A"]
      metric_colors:
        publications: 3
        patents: 0
        clinical_trials: 2
        policy_documents: 1
        datasets: 3
        cross_sector: 4
        altmetric: 5
        grants: 6
        international: 7
        open_access: 2
        preprints: 3
      c_primary_light: "#C8D5E8"
      figsize_main:  [16, 9.9]
      figsize_panel: [18, 11.5]
      title_fs: 22
      label_fs: 18
      tick_fs: 16
      annot_fs: 14
      legend_fs: 14
      body_fs: 14
      marker_size: 9.5
      dot_marker_area: 92
      grid_linestyle: "--"
      axes_linewidth: 1.1
      tick_length: 6
      tick_width: 1.2
      tick_pad: 5
      minor_tick_length: 3.5
      minor_tick_width: 0.9
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/01_growth
      roles:
        c_primary: 3        # blue
        c_accent:  0        # red
        c_gold:    1        # gold
        c_green:   2        # green

    01_authors:
      figsize_map:     [14, 8]
      figsize_network: [12, 12]
      savedir: output/figures/data_analysis/01_authors
      roles:
        c_primary: 3        # blue
        c_accent:  0        # red
        c_gold:    1        # gold
        c_green:   2        # green
      gender_colors:
        female: 0
        male:   3
        unknown: "#BBBBBB"

    05_author_characteristics:
      # The project palette (D29): the seven colours of shared_style.PALETTE_COLORS, in
      # the same order, so an integer role below and a `palette("navy")` call in the plot
      # module resolve to the same hex. This section used to carry an eight-colour
      # literal of its own (crimson / gold / olive / royal blue / purple / teal / brown /
      # slate); every semantic map below was re-pointed onto the shared colours, which is
      # why the indexes changed as well as the palette.
      #
      #   0 red  1 cream  2 light_blue  3 blue  4 steel_blue  5 navy  6 green
      colors: ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1",
               "#416FA0", "#274668", "#74D1AF"]
      # Domain colours for lines, categorical marks and supplementary sequential maps.
      # The headline map uses Blues; its impact panels use shared blue-cream-red.
      domain_colors:
        author_metrics: 4         # steel blue
        name_gender: 0            # red
        geography: 5              # navy
        institutions: 6           # green
        networks: 3               # blue
      author_metric_colors:
        productivity: 4           # steel blue
        h_index: 0                # red
        h_index_kde: 5            # navy
        association: 3            # blue
      # Leading-author bars and colourbar use the full shared blue-cream-red scale.
      gender_colors:
        Female: 0                 # red
        Male: 4                   # steel blue
        Unknown: "#B7B7B7"        # deliberately neutral: not a category, an absence
      # The four network component classes, ordered cream -> light blue -> navy so the
      # size ordering is legible as a ramp, with the red reserved for the isolates that
      # sit outside that ordering.
      component_colors:
        Isolate: 0                # red
        Small (2-5): 1            # cream
        Intermediate (6-55): 2    # light blue
        Giant component: 5        # navy
      figsize_main: [18.5, 10.4]
      figsize_headline: [18.5, 15.5]
      figsize_panel: [15.5, 9.2]
      title_fs: 20
      label_fs: 15
      tick_fs: 13
      annot_fs: 11
      legend_fs: 11
      body_fs: 12
      marker_size: 9.5
      dot_marker_area: 92
      grid_linestyle: "--"
      axes_linewidth: 1.1
      tick_length: 5.5
      tick_width: 1.1
      tick_pad: 4
      minor_tick_length: 3
      minor_tick_width: 0.8
      # Headline map: Matplotlib Blues. Other continuous scales use shared_style:
      # blue_cream_red_colormap for impact, leading-author, gender-by-field and
      # country-period panels; sequential_colormap for supplementary maps.
      edgecolor: black
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/05_author_characteristics
      roles:
        c_primary: 5              # navy
        c_accent: 0               # red
        c_gold: 1                 # cream
        c_green: 6                # green

    02_content: &content_style
      # One content-analysis notebook; shared project palette and publication exports.
      colors: ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1",
               "#416FA0", "#274668", "#74D1AF"]
      title_fs: 15
      label_fs: 12
      tick_fs: 10
      annot_fs: 9
      legend_fs: 10
      body_fs: 11
      panel_label_fs: 18
      fs_scale:
        main: 1.0
        si1_rank_flow: 1.0
      axes_linewidth: 1.0
      tick_length: 4
      tick_width: 1.0
      tick_pad: 3
      minor_tick_length: 2.5
      minor_tick_width: 0.7
      edgecolor: black
      marker_size: 8.5
      dot_marker_area: 76
      figsize_main: [16, 12]
      figsize_si: [15, 10]
      save: true
      formats: [pdf, png]
      savedir: output/figures/data_analysis/02_content

    # Backwards-compatible style name for existing panel callers.
    02_content_99_all:
      <<: *content_style

    04_non_academic_03_altmetric:
      # Was `plt.rcParams['font.family'] = 'Helvetica'` inline, the only notebook that
      # set a font by hand; it now takes the shared base like everything else.
      savedir: output/figures/data_analysis/04_non_academic

    03_academic_impact:
      # slightly smaller type: these figures are dense small-multiple grids
      title_fs:  15
      label_fs:  12
      tick_fs:   10
      annot_fs:   9
      legend_fs: 10
      savedir: output/figures/data_analysis/03_academic_impact

    03_academic_impact_panels:
      # The assembled main + SI panels in Part IV of the consolidated analysis 03
      # notebook. Same seven named colours as
      # 04_non_academic_panels, listed in the same order as shared_style.PALETTE, so the
      # two figure families belong to one paper (D29).
      #
      #   0 red  1 cream  2 light_blue  3 blue  4 steel_blue  5 navy  6 green
      colors: ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1",
               "#416FA0", "#274668", "#74D1AF"]
      title_fs: 15
      label_fs: 12
      tick_fs: 10
      annot_fs: 9
      legend_fs: 10
      body_fs: 11
      panel_label_fs: 15          # the bold A / B / C stamped on each sub-panel
      # Per-figure type scale, as in the 04 family: every font size above is multiplied
      # by the entry for the figure being drawn. The main page is four grid rows tall and
      # is read at figure width in a paper, so it carries the largest scale.
      fs_scale:
        main: 1.34
        si1_impact_map: 1.05
        si2_top_decile: 1.05
        si3_growth: 1.10
      axes_linewidth: 1.0
      tick_length: 4
      tick_width: 1.0
      tick_pad: 3
      minor_tick_length: 2.5
      minor_tick_width: 0.7
      edgecolor: black
      marker_size: 8.5
      dot_marker_area: 76
      figsize_main:     [19, 18]  # A (2x2), B and C stacked beside it, D-K full width
      figsize_si_wide:  [14, 10]  # SI 1 and SI 2, one full-page panel each
      figsize_si:       [16, 8]   # SI 3: two panels side by side
      save: true
      # pdf + png only, per D32. `*.svg` is gitignored, so an svg written here is a file
      # the repo cannot carry — and §8 of the notebook already says pdf and png only.
      formats: [pdf, png]
      savedir: output/figures/data_analysis/03_academic_impact

    04_non_academic_panels:
      # The assembled main + SI panels for analysis 04. This section owns the palette the
      # whole non-academic story is drawn in: seven named colours, listed here in the same
      # order as shared_style.PALETTE, so an integer role below and a `palette("navy")`
      # call in the panel module resolve to the same hex.
      #
      #   0 red  1 cream  2 light_blue  3 blue  4 steel_blue  5 navy  6 green
      colors: ["#E66859", "#FEE7BA", "#75BBD4", "#74ADD1",
               "#416FA0", "#274668", "#74D1AF"]
      title_fs: 15
      label_fs: 12
      tick_fs: 10
      annot_fs: 9
      legend_fs: 10
      body_fs: 11
      panel_label_fs: 15          # the bold A / B / C stamped on each sub-panel
      # Per-figure type scale. Every font size above is multiplied by the entry for the
      # figure being drawn, so the family can be tuned figure by figure without a second
      # style section that would drift from this one.
      #
      # The numbers track how tall each page is, because that is what sets the zoom it is
      # read at: a figure drawn two pages tall is viewed at half the magnification of a
      # one-page figure, so its type has to be correspondingly larger to land the same
      # size on screen. si2 is 1.30x the base height; si1_patents is back to 1.0x now
      # that the RCDC cluster heatmap has a page of its own.
      fs_scale:
        main: 1.32
        si1_patents: 1.15
        si2_clinical_trials: 1.25
      axes_linewidth: 1.0
      tick_length: 4
      tick_width: 1.0
      tick_pad: 3
      minor_tick_length: 2.5
      minor_tick_width: 0.7
      edgecolor: black
      figsize_main: [17, 15]      # the one main-paper panel (sized for main_fs_scale)
      figsize_si:   [15, 11]      # one SI panel per section
      save: true
      # pdf + png only, per D32. `*.svg` is gitignored, so an svg written here is a file
      # the repo cannot carry and the manifest cell counts anyway.
      formats: [pdf, png]
      savedir: output/figures/data_analysis/04_non_academic
      roles:
        c_primary:   5            # navy
        c_secondary: 4            # steel blue
        c_accent:    0            # red
        c_light:     2            # light blue
        c_green:     6            # green
        c_cream:     1            # cream
      # One colour per evidence stream, held constant across every panel in the figure
      # family: a reader who learns "steel blue = patents" in panel A keeps it in panel F.
      stream_colors:
        publications:    3        # blue
        patents:         4        # steel blue
        clinical_trials: 5        # navy  — the arm's own notebook draws in LCDS blue
        policy:          0        # red   #344874; navy #274668 is the palette's nearest
        altmetric:       2        # light blue
        collaboration:   6        # green — freed when trials took the navy
      # The collaborator taxonomy's eight sectors. Company sectors take the warm end of
      # the palette so they separate from the public-sector blues at a glance.
      sector_colors:
        "University/HEI":            3
        "Hospital/Clinical":         2
        "Government/Public":         4
        "Research institute/Centre": 6
        "Nonprofit/Charity":         1
        "Company (non-UK)":          5
        "UK company":                0
        "Other/Unknown":             "#BDBDBD"

    04_non_academic_01_clinical_trials:
      colors: ["#344874",   # LCDS blue
               "#FFBB00",   # LCDS gold
               "#2A9D8F",   # teal
               "#5B8DB8",   # soft blue
               "#E76F51",   # coral
               "#8E6C9E",   # muted purple
               ]
      figsize: [10, 7]
      edgecolor: black
      savedir: output/figures/data_analysis/04_non_academic/clinical_trials
      roles:
        c_accent:  3        # soft blue
        c_gold:    1        # gold
        c_green:   2        # teal
        c_primary: 0        # LCDS blue
